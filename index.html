<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F5">
<title>Lookbook Koleksi — Katalog Fashion</title>
<meta name="description" content="Kurasi outfit pilihan dan rekomendasi produk fashion terbaru.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF8F5;
    --surface:#F2EDE6;
    --card:#FFFFFF;
    --ink:#1C1917;
    --muted:#78716C;
    --line:#E7E2DA;
    --accent:#8C5A3C;
    --accent-soft:#F6EDE7;
    --btn-dark:#1C1917;
    --btn-dark-hover:#332E2A;
    --shadow-sm:0 2px 10px rgba(28,25,23,.04);
    --shadow-lg:0 16px 36px rgba(28,25,23,.16);
    --safe-bottom:env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;
    font-size:14px;
    line-height:1.45;
    padding-bottom:calc(28px + var(--safe-bottom));
  }

  /* Header Storefront */
  header{
    position:sticky;
    top:0;
    z-index:10;
    background:rgba(250,248,245,.92);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
    padding:12px 14px 10px;
  }
  .header-inner{
    max-width:1120px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .brand-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .brand-title{
    display:flex;
    flex-direction:column;
  }
  .eyebrow{
    font-size:10px;
    font-weight:700;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--accent);
  }
  h1{
    font-family:"Cormorant Garamond",Georgia,serif;
    font-size:25px;
    line-height:1.1;
    margin:2px 0 0;
    font-weight:700;
    letter-spacing:-.01em;
    color:var(--ink);
  }
  .btn-share-store{
    height:36px;
    padding:0 13px;
    border-radius:99px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
    font:inherit;
    font-size:12px;
    font-weight:600;
    display:inline-flex;
    align-items:center;
    gap:6px;
    cursor:pointer;
    transition:background .15s,transform .12s;
  }
  .btn-share-store:active{transform:scale(.96);background:var(--surface)}
  @media(min-width:640px){
    .header-inner{flex-direction:row;align-items:center;justify-content:space-between}
  }

  /* Search Bar */
  .search-wrap{
    position:relative;
    flex:1;
    max-width:440px;
  }
  .search-icon{
    position:absolute;
    left:13px;
    top:50%;
    transform:translateY(-50%);
    color:var(--muted);
    pointer-events:none;
    display:flex;
  }
  .search-wrap input{
    width:100%;
    height:42px;
    padding:0 38px;
    border:1px solid var(--line);
    border-radius:99px;
    font:inherit;
    font-size:14px;
    background:var(--card);
    color:var(--ink);
    transition:border-color .2s,box-shadow .2s;
  }
  .search-wrap input::placeholder{color:var(--muted)}
  .search-wrap input:focus{
    outline:none;
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
  }
  .clear-search{
    position:absolute;
    right:6px;
    top:50%;
    transform:translateY(-50%);
    width:30px;
    height:30px;
    border:none;
    background:transparent;
    color:var(--muted);
    border-radius:50%;
    display:none;
    place-items:center;
    cursor:pointer;
    font-size:16px;
  }
  .clear-search.show{display:grid}

  /* Toolbar & Filter Chips */
  main{
    padding:12px 14px;
    max-width:1120px;
    margin:0 auto;
  }
  .toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:12px;
    flex-wrap:wrap;
  }
  .count{
    color:var(--muted);
    font-size:12.5px;
    font-weight:500;
    margin:0;
  }
  .chips{
    display:flex;
    gap:6px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{display:none}
  .chip{
    border:1px solid var(--line);
    background:var(--card);
    color:var(--muted);
    border-radius:99px;
    padding:6px 12px;
    font:inherit;
    font-size:12px;
    font-weight:600;
    white-space:nowrap;
    cursor:pointer;
    transition:all .15s;
  }
  .chip.active{
    background:var(--ink);
    border-color:var(--ink);
    color:#fff;
  }

  /* Grid 2 Kolom di HP */
  .grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
  }
  @media(min-width:600px){
    main{padding:18px 20px}
    .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  }
  @media(min-width:920px){
    .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
  }

  /* Buyer Lookbook Card */
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    box-shadow:var(--shadow-sm);
    transition:transform .2s,box-shadow .2s;
  }
  @media(hover:hover){
    .card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(28,25,23,.08)}
    .card:hover .thumb img{transform:scale(1.04)}
  }
  .thumb{
    aspect-ratio:3/4;
    background:var(--surface);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    color:var(--muted);
    font-size:11.5px;
    position:relative;
    overflow:hidden;
    cursor:pointer;
  }
  .thumb img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    transition:transform .35s ease;
  }
  .zoom-badge{
    position:absolute;
    right:8px;
    bottom:8px;
    z-index:2;
    width:28px;
    height:28px;
    border-radius:50%;
    background:rgba(255,255,255,.85);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    color:var(--ink);
    display:grid;
    place-items:center;
    pointer-events:none;
    box-shadow:0 2px 6px rgba(0,0,0,.08);
  }

  .body{
    padding:10px 10px 11px;
    display:flex;
    flex-direction:column;
    gap:4px;
    flex:1;
  }
  @media(min-width:600px){.body{padding:12px 14px 14px;gap:6px}}
  .name{
    font-weight:600;
    font-size:13px;
    line-height:1.35;
    color:var(--ink);
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
    min-height:2.7em;
    cursor:pointer;
  }
  @media(min-width:600px){.name{font-size:14px}}
  .price{
    font-size:14.5px;
    font-weight:700;
    color:var(--accent);
    letter-spacing:-.01em;
    margin-top:2px;
  }
  @media(min-width:600px){.price{font-size:16px}}

  .actions{
    display:flex;
    gap:6px;
    margin-top:auto;
    padding-top:8px;
  }
  .btn-buy{
    flex:1;
    height:38px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    text-decoration:none;
    background:var(--btn-dark);
    color:#fff;
    border-radius:10px;
    font-weight:600;
    font-size:12.5px;
    transition:background .15s,transform .12s;
  }
  .btn-buy:active{transform:scale(.97)}
  .btn-buy:hover{background:var(--btn-dark-hover)}
  .btn-icon{
    width:38px;
    height:38px;
    flex:none;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--bg);
    color:var(--ink);
    display:grid;
    place-items:center;
    padding:0;
    cursor:pointer;
    transition:background .15s,transform .12s;
  }
  .btn-icon:active{transform:scale(.94);background:var(--surface)}

  /* Skeleton Loading */
  .skeleton{
    background:linear-gradient(90deg,var(--surface) 25%,#FAF7F2 50%,var(--surface) 75%);
    background-size:200% 100%;
    animation:shimmer 1.3s infinite;
  }
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

  /* Empty & Error State */
  .empty{
    text-align:center;
    color:var(--muted);
    padding:52px 20px;
    grid-column:1/-1;
    background:var(--card);
    border:1px dashed var(--line);
    border-radius:18px;
  }
  .empty strong{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
  .btn-retry{
    margin-top:14px;
    height:40px;
    padding:0 18px;
    border-radius:99px;
    border:none;
    background:var(--btn-dark);
    color:#fff;
    font:inherit;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }

  /* Quick View Bottom Sheet (Detail Produk Pembeli) */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(28,25,23,.52);
    backdrop-filter:blur(3px);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:30;
    opacity:0;
    pointer-events:none;
    transition:opacity .22s ease;
  }
  .overlay.show{opacity:1;pointer-events:auto}
  .sheet{
    background:var(--card);
    width:100%;
    max-width:440px;
    max-height:92dvh;
    overflow-y:auto;
    border-radius:24px 24px 0 0;
    padding:10px 18px calc(20px + var(--safe-bottom));
    transform:translateY(100%);
    transition:transform .26s cubic-bezier(.22,1,.36,1);
  }
  .overlay.show .sheet{transform:translateY(0)}
  @media(min-width:560px){
    .overlay{align-items:center;padding:16px}
    .sheet{border-radius:22px;padding:20px;transform:translateY(14px)}
  }
  .sheet-handle{
    width:38px;
    height:4px;
    border-radius:99px;
    background:var(--line);
    margin:0 auto 12px;
  }
  @media(min-width:560px){.sheet-handle{display:none}}
  .sheet-media{
    position:relative;
    aspect-ratio:3/4;
    max-height:54dvh;
    width:100%;
    border-radius:16px;
    overflow:hidden;
    background:var(--surface);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--muted);
  }
  .sheet-media img{
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .btn-close-sheet{
    position:absolute;
    top:10px;
    right:10px;
    width:36px;
    height:36px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.7);
    background:rgba(255,255,255,.88);
    backdrop-filter:blur(6px);
    color:var(--ink);
    display:grid;
    place-items:center;
    cursor:pointer;
    font-size:20px;
  }
  .sheet-info{padding-top:14px}
  .sheet-title{
    font-size:17px;
    font-weight:700;
    line-height:1.35;
    margin:0;
    color:var(--ink);
  }
  .sheet-price{
    font-size:20px;
    font-weight:700;
    color:var(--accent);
    margin:6px 0 16px;
  }
  .sheet-actions{
    display:flex;
    gap:10px;
  }
  .sheet-actions .btn-buy{
    height:46px;
    font-size:14px;
    border-radius:12px;
  }
  .sheet-actions .btn-secondary{
    height:46px;
    padding:0 16px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--bg);
    color:var(--ink);
    font:inherit;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
  }

  /* Footer */
  footer{
    text-align:center;
    color:var(--muted);
    font-size:12px;
    margin-top:28px;
    padding:0 16px;
  }

  /* Toast */
  .toast{
    position:fixed;
    left:50%;
    bottom:calc(22px + var(--safe-bottom));
    transform:translate(-50%,10px);
    background:var(--ink);
    color:#fff;
    padding:10px 18px;
    border-radius:99px;
    font-size:13px;
    font-weight:500;
    box-shadow:var(--shadow-lg);
    opacity:0;
    pointer-events:none;
    transition:opacity .2s,transform .2s;
    z-index:40;
    white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media(prefers-reduced-motion:reduce){.toast,.sheet,.overlay,.card,.thumb img{transition:none}}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand-row">
      <div class="brand-title">
        <span class="eyebrow">Curated Lookbook</span>
        <h1>Koleksi Fashion</h1>
      </div>
      <button type="button" class="btn-share-store" id="btnShareStore" aria-label="Bagikan katalog">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.59 13.51 6.83 3.98M15.41 6.51l-6.82 3.98"/></svg>
        <span>Bagikan</span>
      </button>
    </div>
    <div class="search-wrap">
      <span class="search-icon" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </span>
      <input id="cari" type="search" placeholder="Cari outfit, atasan, celana…" aria-label="Cari produk fashion">
      <button type="button" class="clear-search" id="clearCari" aria-label="Hapus pencarian">&times;</button>
    </div>
  </div>
</header>

<main>
  <div class="toolbar">
    <p class="count" id="count">Memuat koleksi…</p>
    <div class="chips" role="tablist" aria-label="Urutkan produk">
      <button type="button" class="chip active" data-sort="terbaru">Terbaru</button>
      <button type="button" class="chip" data-sort="termurah">Termurah</button>
      <button type="button" class="chip" data-sort="termahal">Termahal</button>
    </div>
  </div>
  <div class="grid" id="grid"></div>
</main>

<footer>
  Tap foto produk untuk detail • Pembelian diarahkan ke toko resmi
</footer>

<!-- Quick View Detail Modal -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-media" id="sheetMedia"></div>
    <div class="sheet-info">
      <h2 class="sheet-title" id="sheetTitle"></h2>
      <div class="sheet-price" id="sheetPrice"></div>
      <div class="sheet-actions">
        <a class="btn-buy" id="sheetBuy" href="#" target="_blank" rel="noopener noreferrer sponsored">
          <span>Beli Sekarang</span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M7 7h10v10"/></svg>
        </a>
        <button type="button" class="btn-secondary" id="sheetCopy">Salin Link</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxI534pnEVPbcJoonGkFiDKsOQPE9yzKI_EM7if0HjbM2JVldTvH1iWIY-BfTEkOcKAAw/exec';

let semua = [], urut = 'terbaru', aktifProduk = null;
const $ = s => document.querySelector(s);
const rp = n => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const thumb = (id, sz = 600) => 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w' + sz;
const aman = u => /^https?:\/\//i.test(u) ? u : '#';

function toast(t){
  const el = $('#toast'); el.textContent = t; el.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2500);
}

function tampilSkeleton(){
  $('#grid').innerHTML = Array.from({length:6}).map(() => `
    <div class="card" aria-hidden="true">
      <div class="thumb skeleton"></div>
      <div class="body">
        <div style="height:14px;border-radius:6px;width:88%" class="skeleton"></div>
        <div style="height:16px;border-radius:6px;width:54%;margin-top:6px" class="skeleton"></div>
        <div style="height:38px;border-radius:10px;margin-top:12px" class="skeleton"></div>
      </div>
    </div>`).join('');
}

async function muat(){
  tampilSkeleton();
  $('#count').textContent = 'Memuat koleksi…';
  try {
    const res = await fetch(API_URL + '?api=1', { redirect: 'follow' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    const list = Array.isArray(json) ? json : (Array.isArray(json.data) ? json.data : []);
    semua = list;
    render();
  } catch (err) {
    $('#count').textContent = 'Gagal memuat data';
    $('#grid').innerHTML = `
      <div class="empty">
        <strong>Katalog belum dapat dimuat</strong>
        Pastikan endpoint Apps Script sudah mengembalikan data JSON.<br>
        <button type="button" class="btn-retry" id="btnRetry">Coba Lagi</button>
      </div>`;
    $('#btnRetry').onclick = muat;
  }
}

function render(){
  const q = $('#cari').value.toLowerCase().trim();
  $('#clearCari').classList.toggle('show', q.length > 0);

  let list = semua.filter(p => String(p.nama || '').toLowerCase().includes(q));
  if (urut === 'termurah') list = [...list].sort((a, b) => Number(a.harga || 0) - Number(b.harga || 0));
  else if (urut === 'termahal') list = [...list].sort((a, b) => Number(b.harga || 0) - Number(a.harga || 0));
  else list = [...list].sort((a, b) => Number(b.row || 0) - Number(a.row || 0));

  $('#count').textContent = list.length + ' produk' + (q ? ' ditemukan' : '');

  if (!list.length){
    $('#grid').innerHTML = '<div class="empty">' +
      (semua.length
        ? '<strong>Outfit tidak ditemukan</strong>Coba kata kunci lain atau hapus pencarian.'
        : '<strong>Koleksi masih kosong</strong>Belum ada produk yang ditampilkan saat ini.') +
      '</div>';
    return;
  }

  $('#grid').innerHTML = list.map((p, idx) => `
    <article class="card">
      <div class="thumb" data-detail="${idx}">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>
        <span>Foto belum tersedia</span>
        ${p.fotoId ? `<img src="${thumb(p.fotoId, 600)}" alt="${esc(p.nama)}" loading="lazy" onerror="this.remove()">` : ''}
        <span class="zoom-badge" aria-hidden="true">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
        </span>
      </div>
      <div class="body">
        <div class="name" data-detail="${idx}">${esc(p.nama)}</div>
        <div class="price">${rp(p.harga)}</div>
        <div class="actions">
          <a class="btn-buy" href="${esc(aman(p.link))}" target="_blank" rel="noopener noreferrer sponsored">
            <span>Beli</span>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M7 7h10v10"/></svg>
          </a>
          <button type="button" class="btn-icon" data-copy="${idx}" title="Salin link produk" aria-label="Salin link ${esc(p.nama)}">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
          </button>
        </div>
      </div>
    </article>`).join('');

  window._renderedList = list;
}

function bukaDetail(p){
  if (!p) return;
  aktifProduk = p;
  $('#sheetTitle').textContent = p.nama || '';
  $('#sheetPrice').textContent = rp(p.harga);
  $('#sheetBuy').href = aman(p.link);
  $('#sheetMedia').innerHTML = `
    ${p.fotoId ? `<img src="${thumb(p.fotoId, 900)}" alt="${esc(p.nama)}" onerror="this.remove()">` : '<span>Foto belum tersedia</span>'}
    <button type="button" class="btn-close-sheet" id="btnCloseSheet" aria-label="Tutup detail">&times;</button>`;
  $('#btnCloseSheet').onclick = tutupDetail;
  $('#overlay').classList.add('show');
}
function tutupDetail(){ $('#overlay').classList.remove('show'); }

async function bagikanAtauSalin(url, judul){
  if (navigator.share){
    try {
      await navigator.share({ title: judul, url });
      return;
    } catch (_) {}
  }
  try {
    await navigator.clipboard.writeText(url);
    toast('Link berhasil disalin');
  } catch (_) {
    toast('Gagal menyalin link');
  }
}

$('#grid').addEventListener('click', e => {
  const list = window._renderedList || [];
  const detailEl = e.target.closest('[data-detail]');
  if (detailEl){
    bukaDetail(list[Number(detailEl.dataset.detail)]);
    return;
  }
  const copyBtn = e.target.closest('[data-copy]');
  if (copyBtn){
    const p = list[Number(copyBtn.dataset.copy)];
    if (p) bagikanAtauSalin(p.link, p.nama);
  }
});

document.querySelectorAll('.chip').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    urut = btn.dataset.sort;
    render();
  });
});

$('#sheetCopy').onclick = () => { if (aktifProduk) bagikanAtauSalin(aktifProduk.link, aktifProduk.nama); };
$('#btnShareStore').onclick = () => bagikanAtauSalin(window.location.href, document.title);
$('#overlay').addEventListener('click', e => { if (e.target.id === 'overlay') tutupDetail(); });
$('#cari').addEventListener('input', render);
$('#clearCari').addEventListener('click', () => { $('#cari').value = ''; render(); $('#cari').focus(); });

muat();
</script>
</body>
</html>
